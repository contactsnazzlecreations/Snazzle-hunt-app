<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#0d563d">
<title>Snazzle Hunt vernieuwen</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#17684c,#083a31);color:#fff7df;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
.load{padding:24px;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.duck{font-size:58px;display:block;margin-bottom:12px}
</style>
</head>
<body>
<div class="load"><span class="duck">🦆✨</span>De nieuwste Snazzle Hunt wordt geladen…</div>
<script>
(async()=>{
  const stamp=Date.now();
  try{
    // Verwijder oude browsercaches en eventuele oude service workers.
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(key=>caches.delete(key)));
    }
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(reg=>reg.unregister()));
    }

    // Niet langer index.html met document.write herschrijven.
    // index.html laadt app.js zelf al met een unieke Date.now()-versie.
    // Een unieke query op de hoofdpagina voorkomt daarnaast een oude HTML-cache.
    location.replace('./?fresh='+encodeURIComponent(stamp));
  }catch(err){
    console.error(err);
    location.replace('./?fresh='+encodeURIComponent(stamp));
  }
})();
</script>
</body>
</html>
