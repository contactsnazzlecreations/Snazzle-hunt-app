<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#0d563d">
<title>Snazzle Hunt</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#247650,#0b3f30 58%,#062c24);color:#fff7df;font-family:system-ui,sans-serif;text-align:center}.load{padding:24px;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.3)}.duck{font-size:64px;display:block;margin-bottom:12px;filter:drop-shadow(0 0 14px rgba(255,222,110,.25))}</style>
</head>
<body><div class="load"><span class="duck">🦆✨</span>Snazzle avontuur wordt geladen…</div>
<script>
fetch('./index.html?fresh='+Date.now(),{cache:'no-store'})
  .then(r=>r.text())
  .then(html=>{
    html=html.replace('./app.js?v=9','./app.js?v=27');
    document.open(); document.write(html); document.close();
  })
  .catch(()=>{document.body.innerHTML='<div class="load">Kon Snazzle Hunt niet laden. Probeer opnieuw.</div>';});
</script>
</body>
</html>
