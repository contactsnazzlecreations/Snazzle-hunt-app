<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#0d563d">
<title>Snazzle Hunt vernieuwen</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#17684c,#083a31);color:#fff7df;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
.load{padding:24px;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.duck{font-size:58px;display:block;margin-bottom:12px}
</style>
</head>
<body>
<div class="load"><span class="duck">🦆✨</span>De nieuwste Snazzle Hunt wordt geladen…</div>
<script>
(()=>{
  const stamp=Date.now();
  let moved=false;
  const go=()=>{
    if(moved) return;
    moved=true;
    location.replace('./?fresh='+encodeURIComponent(stamp));
  };

  // Absolute guarantee: the refresh page itself can never get stuck.
  setTimeout(go,900);

  (async()=>{
    try{
      const cleanup=[];
      if('caches' in window){
        cleanup.push(caches.keys().then(keys=>Promise.all(keys.map(key=>caches.delete(key)))).catch(()=>{}));
      }
      if('serviceWorker' in navigator){
        cleanup.push(navigator.serviceWorker.getRegistrations().then(regs=>Promise.all(regs.map(reg=>reg.unregister()))).catch(()=>{}));
      }
      await Promise.race([Promise.all(cleanup),new Promise(resolve=>setTimeout(resolve,650))]);
    }catch(err){ console.warn(err); }
    go();
  })();
})();
</script>
</body>
</html>
