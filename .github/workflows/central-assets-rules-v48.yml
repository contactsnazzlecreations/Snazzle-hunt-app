name: Central Snazzle assets rules v48

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/central-assets-rules-v48.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow shared app assets in Firestore
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('firestore.rules')
          text=p.read_text(encoding='utf-8')
          if 'match /snazzleAppAssets/{assetId}' in text:
              print('Rules already present')
          else:
              marker='    match /{document=**} {'
              block='''    // Centrale Snazzle app-afbeeldingen: iedereen die de app gebruikt mag ze lezen.\n    // Alleen de hoofdbeheerder mag het gedeelde uiterlijk aanpassen.\n    match /snazzleAppAssets/{assetId} {\n      allow read: if signedIn();\n      allow create, update, delete: if isSuperAdmin();\n    }\n\n'''
              if marker not in text:
                  raise SystemExit('Catch-all marker not found')
              text=text.replace(marker,block+marker,1)
              p.write_text(text,encoding='utf-8')
          PY
      - name: Commit Firestore rule
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules
          git commit -m "Allow central shared Snazzle app assets v48"
          git push
