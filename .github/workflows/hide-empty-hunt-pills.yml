name: Hide empty hunt pills

on:
  push:
    paths:
      - '.github/workflows/hide-empty-hunt-pills.yml'
      - '.github/scripts/hide_empty_hunt_pills.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch app
        run: python .github/scripts/hide_empty_hunt_pills.py

      - name: Commit patched app
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Hide empty hunt metadata pill"
          git push
