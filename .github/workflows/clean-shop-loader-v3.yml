name: Clean shop loader v3

on:
  push:
    paths:
      - '.github/workflows/clean-shop-loader-v3.yml'
      - '.github/scripts/clean_shop_loader_v3.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Clean shop loader
        run: python .github/scripts/clean_shop_loader_v3.py
      - name: Commit loader fix
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js
          git commit -m "Load shop once with cache busting"
          git push
