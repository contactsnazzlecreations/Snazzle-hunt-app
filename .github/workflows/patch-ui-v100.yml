name: Patch Snazzle UI v100

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-ui-v100.yml'
      - '.github/scripts/patch_ui_v100.py'
      - 'snazzle-ui-v100.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch app entrypoint
        run: python .github/scripts/patch_ui_v100.py
      - name: Commit changes when needed
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Apply stable premium Home v100 and Snazzle splash"
          git push
