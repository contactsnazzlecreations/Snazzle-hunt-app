name: Enable shop loader

on:
  push:
    paths:
      - '.github/workflows/enable-shop-loader.yml'
      - '.github/scripts/enable_shop_loader.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable shop module
        run: python .github/scripts/enable_shop_loader.py

      - name: Commit index update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load shop module in app"
          git push
