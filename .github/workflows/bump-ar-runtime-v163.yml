name: Bump AR runtime v163

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-ar-runtime-v163.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Bump Snazzle runtime cache key
        run: python .github/scripts/bump_ar_runtime_v163.py

      - name: Commit runtime bump
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Bump Snazzle runtime for AR v163"
          git push
