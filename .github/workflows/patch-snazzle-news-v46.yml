name: Patch Snazzle News v46

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-snazzle-news-v46.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch app, cache marker and Firestore rules
        run: python .github/scripts/patch_snazzle_news_v46.py

      - name: Commit Snazzle News integration
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html firestore.rules
          git commit -m "Enable interactive Snazzle newspaper"
          git push
