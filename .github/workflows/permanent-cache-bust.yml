name: Manual Snazzle cache activation v269

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Activate fresh v269 assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          version='269'
          runtime='20260918-v269-image-admin'

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'(href="\.\/app\.js\?v=)[^"]+', r'\g<1>'+version, s)
          s=re.sub(r'(href="\.\/app-runtime-v245\.js\?v=)[^"]+', r'\g<1>'+version, s)
          s=re.sub(r'(href="\.\/snazzle-clean-home-v31\.js\?v=)[^"]+', r'\g<1>'+version, s)
          s=re.sub(r'(href="\.\/snazzle-home-card-backgrounds-v75\.js\?v=)[^"]+', r'\g<1>'+version, s)
          s=re.sub(r'(src="\.\/snazzle-clean-home-v31\.js\?v=)[^"]+', r'\g<1>'+version, s)
          s=re.sub(r'(src="\.\/app\.js\?v=)[^"]+', r'\g<1>'+version, s)
          p.write_text(s,encoding='utf-8')

          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'Snazzle Hunt v\d+', 'Snazzle Hunt v'+version, s, count=1)
          s=re.sub(r'v=\d+', 'v='+version, s)
          s=re.sub(r'20260917-v\d+-[a-z0-9-]+', runtime, s)
          p.write_text(s,encoding='utf-8')

          p=Path('app-runtime-v245.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'Snazzle Hunt v\d+', 'Snazzle Hunt v'+version, s, count=1)
          s=re.sub(r"const runtimeVersion='[^']+';", "const runtimeVersion='"+runtime+"';", s, count=1)
          s=re.sub(r'\.\/snazzle-clean-home-v31\.js\?v=\d+', './snazzle-clean-home-v31.js?v='+version, s)
          s=re.sub(r'\.\/snazzle-central-visuals-v54\.js\?v=\d+', './snazzle-central-visuals-v54.js?v='+version, s)
          needle="'./snazzle-news-v47.js','./snazzle-news-bg-v48.js','./snazzle-parent-hub-v65.js'"
          replacement="'./snazzle-news-v47.js','./snazzle-news-bg-v48.js','./snazzle-news-card-bg-v49.js','./snazzle-parent-hub-v65.js'"
          if 'snazzle-news-card-bg-v49.js' not in s:
              if needle not in s:
                  raise SystemExit('Snazzle Nieuws fast bundle not found')
              s=s.replace(needle,replacement,1)
          p.write_text(s,encoding='utf-8')

          p=Path('manifest.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          data['start_url']='./?v='+version
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit activation
        run: |
          if git diff --quiet; then
            echo "Already active"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js app-runtime-v245.js manifest.json
          git commit -m "Activate Snazzle cache v269"
          git push
