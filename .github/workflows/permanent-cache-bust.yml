name: Permanent Snazzle cache fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/permanent-cache-bust.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make the main app entry always load the current build
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          # Browser/proxy hints: the HTML shell itself should be treated as disposable.
          if 'http-equiv="Cache-Control"' not in html:
              html = html.replace(
                  '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">',
                  '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n'
                  '<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n'
                  '<meta http-equiv="Pragma" content="no-cache">\n'
                  '<meta http-equiv="Expires" content="0">'
              )

          # Replace every old fixed app.js version with a per-load unique module URL.
          dynamic_loader = '<script type="module">import(`./app.js?v=${Date.now()}`);</script>'
          html = re.sub(
              r'<script\s+type=["\']module["\']\s+src=["\']\.\/app\.js(?:\?v=[^"\']*)?["\']\s*></script>',
              dynamic_loader,
              html,
              flags=re.I
          )

          p.write_text(html, encoding='utf-8')
          PY

      - name: Commit permanent cache fix
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make Snazzle main link always load fresh app files"
          git push
