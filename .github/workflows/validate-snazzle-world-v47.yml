name: Validate Snazzle World v47

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check active JavaScript syntax
        shell: bash
        run: |
          node --check snazzle-world-hub-v47.js
          for f in app.js app-runtime-v245.js app-core.js snazzle-admin-mfa-v141.js snazzle-admin-shell-v268.js snazzle-ar-admin-display-v84.js snazzle-ar-admin-v245.js snazzle-ar-engine-v245.js snazzle-ar-placement-v245.js; do
            cp "$f" "/tmp/$(basename "$f" .js).mjs"
            node --check "/tmp/$(basename "$f" .js).mjs"
          done

      - name: Check AR v245 direct architecture
        shell: bash
        run: |
          grep -Eq "app-runtime-v245\\.js\\?v=[0-9]+" app.js
          grep -q "snazzle-admin-mfa-v141.js" app-runtime-v245.js
          grep -q "snazzle-admin-shell-v268.js" app-runtime-v245.js
          grep -q "snazzle-ar-engine-v245.js" app-runtime-v245.js
          grep -q "snazzle-ar-admin-v245.js" app-runtime-v245.js
          grep -q "snazzle-ar-placement-v245.js" app-runtime-v245.js
          ! grep -q "snazzle-ar-engine-v244.js" app-runtime-v245.js
          ! grep -q "snazzle-ar-placement-v244.js" app-runtime-v245.js
          ! grep -q "snazzle-ar-global-v240.js" app-runtime-v245.js
          ! grep -q "snazzle-ar-world-v85.js" app-runtime-v245.js
          ! grep -q "snazzle-ar-place-rescue-v194.js" app-runtime-v245.js
          ! grep -q "snazzle-ar-map-gesture-fix-v196.js" app-runtime-v245.js
          ! grep -q "snazzle-ar-maponly-fix-v198.js" app-runtime-v245.js
          ! grep -q "snazzle-ar-zone-map-v169.js" app-runtime-v245.js

      - name: Check AR compatibility loader has no legacy controllers
        shell: bash
        run: |
          ! grep -q "snazzle-ar-world-v85.js" snazzle-ar-admin-display-v84.js
          ! grep -q "snazzle-ar-place-studio-v90.js" snazzle-ar-admin-display-v84.js
          ! grep -q "snazzle-ar-zone-map-fix-v112.js" snazzle-ar-admin-display-v84.js
          grep -q "snazzle-ar-admin-guard-v85.js" snazzle-ar-admin-display-v84.js
          grep -q "snazzle-ar-stats-v113.js" snazzle-ar-admin-display-v84.js

      - name: Check AR v246 stability invariants
        shell: bash
        run: |
          grep -q "sessionToken" snazzle-ar-engine-v245.js
          grep -q "uncaughtPoints" snazzle-ar-engine-v245.js
          grep -q "maximumAge:8000" snazzle-ar-engine-v245.js
          grep -q "cameraToken" snazzle-ar-placement-v245.js
          grep -q "validatePlacementSource" snazzle-ar-placement-v245.js
          grep -q "MAX_GPS_SAVE_ACCURACY=50" snazzle-ar-placement-v245.js
          grep -q "runTransaction" snazzle-ar-admin-v245.js
          grep -q "mutateWorld" snazzle-ar-admin-v245.js
          grep -q "MAX_QUICK_GPS_ACCURACY=50" snazzle-ar-admin-v245.js
          grep -q "mode:'camera-composed'" snazzle-ar-placement-v245.js
          grep -q "mode:'map-only'" snazzle-ar-placement-v245.js
          grep -q "L.map" snazzle-ar-placement-v245.js
          grep -q "touchZoom:true" snazzle-ar-placement-v245.js
          grep -q "sn245MapCanvas" snazzle-ar-placement-v245.js
          grep -q "touch-action:none" snazzle-ar-placement-v245.js
          ! grep -q "sn245MapFrame" snazzle-ar-placement-v245.js
          grep -q "MAP_TILE_PROVIDERS" snazzle-ar-placement-v245.js
          grep -q "sourceX" snazzle-ar-placement-v245.js
          grep -q "mappedPlacement" snazzle-ar-engine-v245.js
          grep -q "TILE_PROVIDERS" snazzle-zones.html
          grep -q "snazzle-ar-place.html?v=278" snazzle-ar-placement-v245.js
          grep -q "Nauwkeurig AR plaatsen" snazzle-ar-place.html
          grep -q "snazzle_ar_world_v1" snazzle-ar-place.html

      - name: Check AR data and public shell invariants
        shell: bash
        run: |
          grep -q "snazzle_ar_world_v1" snazzle-ar-engine-v245.js
          grep -q "snazzle_ar_world_v1" snazzle-ar-admin-v245.js
          grep -q "snazzle_ar_world_v1" snazzle-ar-placement-v245.js
          grep -Eq "snazzle-zones\.html\?v=[0-9]+" snazzle-ar-engine-v245.js
          grep -q "playsinline" snazzle-ar-v80.js
          grep -Eq 'src="./app\.js\?v=[0-9]+"' index.html
