name: Validate Snazzle World v47

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check active JavaScript syntax
        run: |
          node --check snazzle-world-hub-v47.js
          node --experimental-default-type=module --check app.js
          node --experimental-default-type=module --check app-runtime-v207.js
          node --experimental-default-type=module --check snazzle-ar-admin-v85.js
          node --experimental-default-type=module --check snazzle-ar-engine-v244.js
          node --experimental-default-type=module --check snazzle-ar-placement-v244.js
