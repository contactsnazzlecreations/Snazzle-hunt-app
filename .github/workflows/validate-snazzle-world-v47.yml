name: Validate Snazzle World v47

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check active JavaScript syntax
        shell: bash
        run: |
          node --check snazzle-world-hub-v47.js
          for f in app.js app-runtime-v207.js snazzle-ar-admin-v85.js snazzle-ar-engine-v244.js snazzle-ar-placement-v244.js; do
            cp "$f" "/tmp/$(basename "$f" .js).mjs"
            node --check "/tmp/$(basename "$f" .js).mjs"
          done
