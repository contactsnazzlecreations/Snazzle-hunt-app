name: Deploy Firebase Security

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-firebase-security.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-security-production
  cancel-in-progress: false

jobs:
  deploy-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI and Functions dependencies
        shell: bash
        run: |
          npm install --global firebase-tools
          npm install --prefix functions --omit=dev

      - name: Validate Firebase configuration
        shell: bash
        run: |
          node --check functions/bootstrap.js
          node --check functions/index.js
          node --check functions/hunt-codes.js
          node --check functions/meetups.js
          node --check functions/admin-mfa.js
          node --check functions/ar-admin.js
          node --check functions/card-progress.js
          node --check functions/card-state.js
          test -f firestore.rules
          test -f firebase.json
          test -f .firebaserc

      - name: Authenticate and deploy security backend
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_SNAZZLE_HUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SNAZZLE_HUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          SA_JSON="${FIREBASE_SERVICE_ACCOUNT_SNAZZLE_HUNT:-${FIREBASE_SERVICE_ACCOUNT:-}}"

          deploy_with_auth() {
            target="$1"
            service_error=0

            if [ -n "$SA_JSON" ]; then
              CREDS="$RUNNER_TEMP/firebase-service-account.json"
              printf '%s' "$SA_JSON" > "$CREDS"
              chmod 600 "$CREDS"
              export GOOGLE_APPLICATION_CREDENTIALS="$CREDS"
              echo "Deploying $target with service account..."
              if firebase deploy --project snazzle-hunt --only "$target" --non-interactive; then
                return 0
              fi
              service_error=1
              echo "Service-account deployment failed; checking Firebase token fallback..." >&2
              unset GOOGLE_APPLICATION_CREDENTIALS
            fi

            if [ -n "${FIREBASE_TOKEN:-}" ]; then
              echo "Deploying $target with Firebase token fallback..."
              firebase deploy --project snazzle-hunt --only "$target" --non-interactive --token "$FIREBASE_TOKEN"
              return 0
            fi

            if [ "$service_error" -eq 1 ]; then
              echo 'Service-account deployment failed and no FIREBASE_TOKEN fallback is configured.' >&2
            else
              echo 'Geen Firebase deployment credential gevonden.' >&2
            fi
            echo 'Configureer FIREBASE_TOKEN of geef het service-account Service Usage Admin voor Cloud Functions/Build/Artifact Registry.' >&2
            exit 1
          }

          # Kritische volgorde: publiceer eerst de Functions die MFA en privacy ondersteunen.
          # Pas wanneer dat volledig slaagt mogen de strengere Firestore-regels live gaan.
          deploy_with_auth functions
          deploy_with_auth firestore:rules

