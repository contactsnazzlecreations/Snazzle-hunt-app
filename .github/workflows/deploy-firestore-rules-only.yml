# AR-beheer: forceer herpublicatie van de actuele Firestore-regels (2026-08-26)
name: Deploy Firestore Rules Only

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - '.firebaserc'
      - 'firebase.json'
      - '.github/workflows/deploy-firestore-rules-only.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules-production
  cancel-in-progress: false

jobs:
  deploy-firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Validate files
        shell: bash
        run: |
          test -f firestore.rules
          test -f firebase.json
          test -f .firebaserc

      - name: Deploy Firestore rules
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_SNAZZLE_HUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SNAZZLE_HUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          SA_JSON="${FIREBASE_SERVICE_ACCOUNT_SNAZZLE_HUNT:-${FIREBASE_SERVICE_ACCOUNT:-}}"

          if [ -n "$SA_JSON" ]; then
            CREDS="$RUNNER_TEMP/firebase-service-account.json"
            printf '%s' "$SA_JSON" > "$CREDS"
            chmod 600 "$CREDS"
            export GOOGLE_APPLICATION_CREDENTIALS="$CREDS"
            firebase deploy --project snazzle-hunt --only firestore:rules --non-interactive
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            firebase deploy --project snazzle-hunt --only firestore:rules --non-interactive --token "$FIREBASE_TOKEN"
          else
            echo 'Geen Firebase deployment credential gevonden.' >&2
            exit 1
          fi
