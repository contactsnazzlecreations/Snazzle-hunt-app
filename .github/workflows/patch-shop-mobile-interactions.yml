name: Patch shop mobile interactions

on:
  push:
    paths:
      - '.github/workflows/patch-shop-mobile-interactions.yml'
      - '.github/scripts/patch_shop_mobile_interactions.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch shop
        run: python .github/scripts/patch_shop_mobile_interactions.py

      - name: Commit patched shop
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shop.js
          git commit -m "Fix shop reservation taps and add product image viewer"
          git push
