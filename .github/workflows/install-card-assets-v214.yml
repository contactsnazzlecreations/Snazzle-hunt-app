name: Install validated Snazzle card assets v214

on:
  push:
    paths:
      - 'assets/cards/snazzle-cards-v214.zip'
      - '.github/workflows/install-card-assets-v214.yml'

permissions:
  contents: write

jobs:
  install-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract 24 fixed card assets
        run: |
          rm -rf assets/cards/v214
          mkdir -p assets/cards/v214
          unzip -q assets/cards/snazzle-cards-v214.zip -d assets/cards/v214
          test "$(find assets/cards/v214 -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 24
          for n in $(seq -w 1 12); do test -s "assets/cards/v214/S01-S${n}.webp"; test -s "assets/cards/v214/S01-W${n}.webp"; done
          file assets/cards/v214/*.webp | grep -c 'Web/P image' | grep -q '^24$'
      - name: Commit validated card assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cards/v214
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Install 24 validated Snazzle card assets v214'
          git push
