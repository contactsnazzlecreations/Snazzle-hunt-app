name: Update Snazzle World content v47.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-snazzle-world-launcher-v471.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add new adventures and expand story chapters safely
        run: python .github/scripts/fix_snazzle_world_launcher_v471.py

      - name: Commit Snazzle World content update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snazzle-world-hub-v47.js app.js index.html
          git commit -m "Expand Snazzle World adventures and stories v47.4"
          git push
