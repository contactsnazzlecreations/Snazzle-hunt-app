name: Fix shop admin text visibility

on:
  push:
    paths:
      - '.github/workflows/patch-shop-admin-text.yml'
      - '.github/scripts/patch_shop_admin_text.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fix shop admin text colors
        run: python .github/scripts/patch_shop_admin_text.py

      - name: Commit shop fix
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shop.js
          git commit -m "Fix visible text in shop product admin fields"
          git push
