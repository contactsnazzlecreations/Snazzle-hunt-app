name: Retry AR interactive placement map v246

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retry-ar-interactive-map-v246.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v246 patch definition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          wf=Path('.github/workflows/fix-ar-interactive-map-v246.yml').read_text()
          marker="python - <<'PY'\n"
          script=wf.split(marker,1)[1].split("\n          PY",1)[0]
          exec(compile(textwrap.dedent(script),'ar-map-v246-patch','exec'))
          PY
      - name: Validate diff
        run: git diff --check && git diff --stat
      - name: Commit and push safely
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snazzle-ar-placement-v245.js app-runtime-v245.js app.js .github/workflows/validate-snazzle-world-v47.yml
          git commit -m "Make AR placement map interactive v246"
          git pull --rebase origin main
          git push
