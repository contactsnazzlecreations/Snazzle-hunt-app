name: AR smooth flow v163

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ar-smooth-v163.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Smooth Snazzle AR flow
        run: python .github/scripts/ar_smooth_v163.py

      - name: Commit AR update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snazzle-ar-v80.js snazzle-ar-world-v85.js
          git commit -m "Smooth Snazzle AR flow v163"
          git push
