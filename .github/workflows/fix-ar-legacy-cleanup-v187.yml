name: Fix AR legacy cleanup v187

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ar-legacy-cleanup-v187.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch AR loader cleanup
        run: python .github/scripts/fix_ar_legacy_cleanup_v187.py

      - name: Commit v187 loader cleanup
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Remove legacy AR loaders and duplicate studio v187"
          git push
