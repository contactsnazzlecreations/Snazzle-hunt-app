name: Build Snazzle card JPG assets v211

on:
  push:
    paths:
      - '.github/workflows/build-card-assets-v211.yml'
      - '.github/scripts/build_card_assets_v211.py'

permissions:
  contents: write

jobs:
  build-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build and validate all 24 cards
        run: python .github/scripts/build_card_assets_v211.py
      - name: Commit generated card JPG files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cards/v211
          if git diff --cached --quiet; then
            echo 'No card asset changes.'
            exit 0
          fi
          git commit -m 'Generate 24 validated Snazzle card JPG assets v211'
          git push
