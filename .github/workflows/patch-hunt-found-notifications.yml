name: Patch hunt found notifications

on:
  push:
    paths:
      - '.github/workflows/patch-hunt-found-notifications.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch app.js
        run: python .github/scripts/patch_hunt_found_notifications.py

      - name: Commit patched app
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Notify registered hunters when a hunt is found"
          git push
