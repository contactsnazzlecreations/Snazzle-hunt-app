<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Snazzle Bieb v144 test</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0d3327;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  .bar{height:54px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px;background:#123f31;color:#fff;border-bottom:2px solid #b98b42;position:relative;z-index:4}
  .bar strong{font-size:13px;line-height:1.1;flex:1}.bar small{display:block;color:#f0d88a;font-size:9px;margin-top:2px}
  .bar button{border:0;border-radius:10px;padding:8px 10px;background:#f0c957;color:#342416;font-weight:900;font-size:11px}
  #status{position:absolute;right:10px;top:58px;z-index:5;padding:6px 9px;border-radius:999px;background:rgba(13,51,39,.92);color:#fff;font-size:9px;font-weight:900;border:1px solid rgba(255,255,255,.25);pointer-events:none}
  iframe{display:block;width:100%;height:calc(100% - 54px);border:0;background:#fff}
</style>
</head>
<body>
<div class="bar"><strong>📚 Bieb v144 test<small>Live app blijft ongewijzigd</small></strong><button id="open" type="button">Open Bieb</button><button id="reload" type="button">Herlaad</button></div>
<div id="status">App laden…</div>
<iframe id="app" src="./index.html?biebtest=144&fresh=20260828-2344" title="Snazzle app Bieb test"></iframe>
<script>
const frame=document.getElementById('app');
const status=document.getElementById('status');
let injected=false;
function setStatus(t){status.textContent=t;}
function injectHub(){
  if(injected)return;
  const d=frame.contentDocument;if(!d?.head)return;
  injected=true;
  const s=d.createElement('script');s.type='module';s.src=new URL('./snazzle-bieb-hub-v144.js?test=20260828-2344',location.href).href;d.head.appendChild(s);
}
function openBieb(){
  try{
    const w=frame.contentWindow;
    w.SnazzleBiebHubV144?.enhance?.();
    if(w.SnazzleBiebV73?.open){w.SnazzleBiebV73.open();setStatus('v144 Bieb klaar ✓');return true;}
    const b=w.document.getElementById('snBiebHome73');if(b){b.click();setStatus('v144 Bieb klaar ✓');return true;}
  }catch(e){console.warn(e)}
  setStatus('Bieb wordt nog geladen…');return false;
}
frame.addEventListener('load',()=>{
  injected=false;setStatus('Snazzle laden…');
  setTimeout(injectHub,500);
  let tries=0;const timer=setInterval(()=>{
    tries++;injectHub();
    const w=frame.contentWindow;
    if(w?.SnazzleBiebHubV144&&openBieb()){clearInterval(timer);}
    else if(tries>50){clearInterval(timer);setStatus('Tik op Open Bieb');}
  },250);
});
document.getElementById('open').onclick=()=>{injectHub();openBieb();};
document.getElementById('reload').onclick=()=>{injected=false;setStatus('Herlaad…');frame.src='./index.html?biebtest=144&fresh='+Date.now();};
</script>
</body>
</html>
