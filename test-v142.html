<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Snazzle v142 test</title>
<style>

</style>
</head>
<body>
<div class="testbadge">TEST v142 · NIET LIVE</div>
<iframe id="appFrame" src="./index.html?testv142=2" title="Snazzle testversie"></iframe>
<script>
const frame=document.getElementById('appFrame');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;if(!d)return;
  let tries=0;
  const timer=setInterval(()=>{
    tries++;
    const big=d.getElementById('bigStart');
    if(!big){if(tries>100)clearInterval(timer);return;}
    clearInterval(timer);
    if(!d.getElementById('snTestSpecial142')){
      const style=d.createElement('style');style.id='snTestStyle142';style.textContent=`
      #snTestSpecial142{width:100%;margin:0 0 18px;border:3px solid #ffdd72;border-radius:20px;padding:13px 14px;background:linear-gradient(135deg,#8b4fc8,#4d78c8);color:#fff;text-align:left;box-shadow:0 6px 0 rgba(54,38,92,.55),0 10px 22px rgba(0,0,0,.18);display:grid;grid-template-columns:47px 1fr 30px;gap:10px;align-items:center}#snTestSpecial142>b{font-size:31px}#snTestSpecial142 strong{display:block;font-size:17px}#snTestSpecial142 small{display:block;margin-top:3px;font-size:11px;color:#f7eaff;font-weight:800}#snTestSpecial142 i{font-style:normal;font-size:28px;color:#ffe487}
      .sn-test-modal142{position:fixed;inset:0;z-index:99999;display:none;background:#07140fe8;padding:18px 10px;overflow:auto}.sn-test-modal142.show{display:block}.sn-test-shell142{width:min(540px,100%);margin:auto;background:linear-gradient(#fff3c7,#ead19a);color:#2d2117;border:3px solid #75512e;border-radius:24px;overflow:hidden;box-shadow:0 18px 46px #0007}.sn-test-head142{display:flex;align-items:center;gap:8px;padding:13px;background:linear-gradient(135deg,#61408a,#365d8f);color:white}.sn-test-head142 h2{margin:0;flex:1;font-size:20px}.sn-test-close142{width:44px;height:44px;border:0;border-radius:13px;background:#fff;color:#46305d;font-size:24px;font-weight:1000}.sn-test-body142{padding:13px}.sn-test-card142{width:100%;border:2px solid #be985e;border-radius:17px;padding:13px;margin:0 0 11px;background:#fff8e7;color:#2e2116;text-align:left;box-shadow:0 3px 0 #a7804a}.sn-test-card142 strong{display:block;font-size:17px}.sn-test-card142 span,.sn-test-card142 small{display:block;margin-top:4px;font-weight:800}.sn-test-card142 small{font-size:11px;color:#6c5639}.sn-test-go142{margin-top:9px!important;display:inline-block!important;padding:8px 11px;border-radius:999px;background:#4b9a39;color:#fff;font-size:11px;font-weight:1000}.sn-test-detail142{padding:16px}.sn-test-detail142 h3{font-size:24px;margin:0 0 8px}.sn-test-pill142{display:inline-block;padding:6px 9px;margin:3px;border-radius:999px;background:#e4c986;font-size:10px;font-weight:950}.sn-test-note142{margin:12px 0;padding:12px;border:2px solid #c6a36c;border-radius:14px;background:#fff8e6;font-weight:850;line-height:1.45}.sn-test-start142{width:100%;border:0;border-radius:15px;padding:14px;background:linear-gradient(#70bd40,#438f2c);color:#fff;font-weight:1000;box-shadow:0 4px 0 #2d6722}
      #snTestAdminSection142{display:none}#snTestAdminSection142.on{display:block!important}.sn-test-admin-note142{padding:12px;border:2px solid #b99a66;border-radius:14px;background:#fff8df;font-size:12px;font-weight:800;line-height:1.45;margin-bottom:12px}.sn-test-admin-card142{background:#fff8e6;border:2px solid #bc995f;border-radius:16px;padding:12px;margin:9px 0}.sn-test-admin-card142 h4{margin:0 0 5px;font-size:16px}.sn-test-admin-card142 small{font-weight:800;color:#6e573a;line-height:1.45}.sn-test-admin-actions142{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.sn-test-admin-actions142 button{border:0;border-radius:12px;padding:9px;font-weight:950;background:#dce9b3;color:#304d24}.sn-test-admin-actions142 button:nth-child(2){background:#cfe1f7;color:#24486b}.sn-test-admin-actions142 button:nth-child(3){background:#ead49e;color:#5b421e}.sn-test-admin-actions142 button:nth-child(4){background:#efc0af;color:#7a281e}.sn-test-editor142{display:none;margin-top:14px;padding-top:12px;border-top:2px dashed #b99a66}.sn-test-editor142.on{display:block}.sn-test-save142{width:100%;border:0;border-radius:15px;padding:13px;background:linear-gradient(#70bd40,#438f2c);color:#fff;font-weight:1000;box-shadow:0 4px 0 #2d6722}`;d.head.appendChild(style);
      const btn=d.createElement('button');btn.id='snTestSpecial142';btn.type='button';btn.innerHTML='<b>🎪</b><span><strong>2 Speciale Hunts vandaag</strong><small>Tijdelijke hunts van organisaties · testvoorbeeld</small></span><i>›</i>';big.insertAdjacentElement('afterend',btn);
      const modal=d.createElement('div');modal.className='sn-test-modal142';modal.id='snTestModal142';modal.innerHTML=`<div class="sn-test-shell142"><div class="sn-test-head142"><h2>Speciale Hunts 🎪</h2><button class="sn-test-close142" type="button">×</button></div><div class="sn-test-body142" id="snTestBody142"><button class="sn-test-card142" data-demo="1"><strong>🎯 Jeugd Hunt Montfort</strong><span>Stichting Jeugd Montfort · 📍 Montfort</span><small>13:00–17:00 · 8 AR Snazzles</small><span class="sn-test-go142">START / BEKIJK HUNT ›</span></button><button class="sn-test-card142" data-demo="2"><strong>🎯 Scouting Speurtocht</strong><span>Scouting Posterholt · 📍 Posterholt</span><small>10:00–16:00 · 6 AR Snazzles</small><span class="sn-test-go142">START / BEKIJK HUNT ›</span></button></div></div>`;d.body.appendChild(modal);
      const close=()=>modal.classList.remove('show');btn.onclick=()=>modal.classList.add('show');modal.querySelector('.sn-test-close142').onclick=close;modal.addEventListener('click',e=>{if(e.target===modal)close()});
      modal.querySelectorAll('[data-demo]').forEach(card=>card.onclick=()=>{const one=card.dataset.demo==='1';const body=modal.querySelector('#snTestBody142');body.innerHTML=`<div class="sn-test-detail142"><h3>${one?'Jeugd Hunt Montfort':'Scouting Speurtocht'}</h3><span class="sn-test-pill142">🏢 ${one?'Stichting Jeugd Montfort':'Scouting Posterholt'}</span><span class="sn-test-pill142">📍 ${one?'Montfort':'Posterholt'}</span><span class="sn-test-pill142">🦆 0/${one?'8':'6'} gevonden</span><div class="sn-test-note142">Dit is de testweergave. In de echte versie start hier de tijdelijke AR-Hunt en opent de camera pas wanneer je bij een AR-punt bent.</div><button class="sn-test-start142" type="button">🔎 Zoek volgende AR Snazzle</button></div>`;});
    }

    function installAdminPreview(){
      const sheet=d.getElementById('adminSheet');
      const tabs=sheet?.querySelector('.super-only .tabs');
      const anchor=sheet?.querySelector('.super-only');
      if(!tabs||!anchor||d.getElementById('snTestAdminTab142'))return;
      const tab=d.createElement('button');tab.type='button';tab.id='snTestAdminTab142';tab.textContent='Special Hunts';tabs.appendChild(tab);
      const section=d.createElement('section');section.className='admin-section';section.id='snTestAdminSection142';section.innerHTML=`<h3>Speciale Hunts 🎪</h3><div class="sn-test-admin-note142">Hier maak je een tijdelijke Hunt voor een stichting, vereniging of evenement. De knop verschijnt alleen tijdens de ingestelde tijd en verdwijnt daarna automatisch. Meerdere Hunts tegelijk zijn mogelijk.</div><button class="save" id="snTestNewHunt142" type="button">+ Nieuwe tijdelijke Hunt</button><div id="snTestAdminList142"><article class="sn-test-admin-card142"><h4>Jeugd Hunt Montfort</h4><small>🏢 Stichting Jeugd Montfort · 📍 Montfort<br>🕒 13:00–17:00 · 🟢 NU ZICHTBAAR · 8 AR-punten</small><div class="sn-test-admin-actions142"><button type="button">Bewerken</button><button type="button">AR-punten</button><button type="button">Uitzetten</button><button type="button">Verwijderen</button></div></article><article class="sn-test-admin-card142"><h4>Scouting Speurtocht</h4><small>🏢 Scouting Posterholt · 📍 Posterholt<br>🕒 10:00–16:00 · 🟢 NU ZICHTBAAR · 6 AR-punten</small><div class="sn-test-admin-actions142"><button type="button">Bewerken</button><button type="button">AR-punten</button><button type="button">Uitzetten</button><button type="button">Verwijderen</button></div></article></div><div class="sn-test-editor142" id="snTestEditor142"><h3>Nieuwe tijdelijke Hunt</h3><div class="field"><label>Organisatie / stichting</label><input value="Stichting voorbeeld"></div><div class="field"><label>Naam Hunt / evenement</label><input value="Zomer Hunt"></div><div class="field"><label>Dorp</label><select><option>Montfort</option><option>Posterholt</option><option>Sint Odiliënberg</option></select></div><div class="row2"><div class="field"><label>Start</label><input type="datetime-local"></div><div class="field"><label>Einde</label><input type="datetime-local"></div></div><button class="sn-test-save142" type="button">Hunt opslaan · TEST</button></div>`;anchor.appendChild(section);
      const openTab=()=>{tabs.querySelectorAll('button').forEach(b=>b.classList.remove('on'));sheet.querySelectorAll('.super-only .admin-section').forEach(s=>s.classList.remove('on'));tab.classList.add('on');section.classList.add('on');};
      tab.addEventListener('click',openTab);
      tabs.querySelectorAll('button:not(#snTestAdminTab142)').forEach(b=>b.addEventListener('click',()=>{tab.classList.remove('on');section.classList.remove('on');}));
      d.getElementById('snTestNewHunt142')?.addEventListener('click',()=>d.getElementById('snTestEditor142')?.classList.toggle('on'));
    }
    installAdminPreview();
    const obs=new MutationObserver(installAdminPreview);obs.observe(d.body,{childList:true,subtree:true});
  },150);
});
</script>
</body>
</html>
