<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Snazzle Beheer</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#073a25;color:#fff}
body{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 30% 10%,rgba(190,235,86,.18),transparent 30%),linear-gradient(180deg,#12643a,#062f20)}
.card{width:min(440px,100%);background:#fff4cf;color:#2e2419;border:4px solid #82552d;border-radius:26px;padding:22px;box-shadow:0 12px 0 #432817,0 26px 60px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:16px}.mark{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#ffe273,#f3ae2d);border:4px solid #7c4e21;box-shadow:0 5px 0 #4c2e18;font-size:30px}.brand h1{margin:0;color:#175934;font-size:25px}.brand p{margin:3px 0 0;color:#7a6241;font-size:12px;font-weight:750}
label{display:block;margin:14px 0 6px;font-weight:900;font-size:13px}input{width:100%;min-height:52px;border:2px solid #b79058;border-radius:14px;padding:12px 13px;background:white;color:#231b14;font-size:16px;outline:none}input:focus{border-color:#4f9236;box-shadow:0 0 0 3px rgba(79,146,54,.18)}
button{width:100%;min-height:54px;margin-top:16px;border:0;border-radius:15px;background:linear-gradient(#69b93e,#438d2d);color:white;font-size:17px;font-weight:1000;box-shadow:0 5px 0 #2d6820;touch-action:manipulation}button:active{transform:translateY(2px);box-shadow:0 3px 0 #2d6820}button:disabled{opacity:.6;transform:none}
.status{min-height:42px;margin-top:14px;padding:11px 12px;border-radius:13px;background:#f2dfaa;color:#5d482e;font-size:12px;font-weight:800;line-height:1.35}.status.error{background:#ffd7cf;color:#842d24}.status.ok{background:#d7f1bd;color:#2e5c25}
.back{display:block;margin-top:14px;text-align:center;color:#5e492d;font-size:12px;font-weight:850;text-decoration:underline}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><div class="mark">🔒</div><div><h1>Snazzle Beheer</h1><p>Veilige directe beheerlogin</p></div></div>
  <form id="loginForm" novalidate>
    <label for="email">E-mailadres</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Wachtwoord</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="loginBtn" type="submit">Inloggen bij Beheer</button>
  </form>
  <div id="status" class="status">Vul je beheergegevens in.</div>
  <a class="back" href="./">Terug naar Snazzle Hunt</a>
</main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';

const firebaseConfig={
 apiKey:'AIzaSyB4iVfasVJgRMJ5GcdkG3ZU136H9FdmAy4',
 authDomain:'snazzle-hunt.firebaseapp.com',
 projectId:'snazzle-hunt',
 storageBucket:'snazzle-hunt.firebasestorage.app',
 messagingSenderId:'647665502495',
 appId:'1:647665502495:web:686488b53db468e887482a',
 measurementId:'G-55G5DE19DL'
};
const app=initializeApp(firebaseConfig); const auth=getAuth(app); const db=getFirestore(app);
const form=document.getElementById('loginForm'), email=document.getElementById('email'), password=document.getElementById('password'), btn=document.getElementById('loginBtn'), status=document.getElementById('status');
try{email.value=localStorage.getItem('snazzleAdminEmail')||'';}catch{}
function setStatus(text,type=''){status.textContent=text;status.className='status'+(type?' '+type:'');}
async function adminProfile(user){ if(!user || user.isAnonymous) return null; const s=await getDoc(doc(db,'adminUsers',user.uid)); return s.exists()?s.data():null; }
async function enterIfAdmin(user){
  const profile=await adminProfile(user);
  if(profile?.active===true){
    try{localStorage.setItem('snazzleAdminEmail',user.email||email.value.trim());}catch{}
    setStatus('Inloggen gelukt. Beheer wordt geopend…','ok');
    // Gebruik de auth-bewuste eenmalige beheerroute. Deze ruimt zichzelf daarna op,
    // zodat een volgende start gewoon op Home uitkomt.
    setTimeout(()=>location.replace('./?veiligbeheer=1'),450);
    return true;
  }
  return false;
}
form.addEventListener('submit',async e=>{
 e.preventDefault();
 const mail=email.value.trim(), pass=password.value;
 if(!mail||!pass){setStatus('Vul e-mailadres en wachtwoord in.','error');return;}
 btn.disabled=true; btn.textContent='Even controleren…'; setStatus('Beheergegevens worden gecontroleerd…');
 try{
   const cred=await signInWithEmailAndPassword(auth,mail,pass);
   if(!(await enterIfAdmin(cred.user))){ await signOut(auth); throw new Error('Dit account heeft geen actieve beheerrechten.'); }
 }catch(err){
   console.error(err);
   let msg='Inloggen lukt niet. Controleer e-mailadres en wachtwoord.';
   if(String(err?.message||'').includes('geen actieve beheerrechten')) msg='Dit account heeft geen actieve beheerrechten.';
   setStatus(msg,'error'); btn.disabled=false; btn.textContent='Inloggen bij Beheer';
 }
});

onAuthStateChanged(auth,async user=>{
 if(!user || user.isAnonymous) return;
 try{ await enterIfAdmin(user); }catch(e){ console.warn(e); }
});
</script>
</body>
</html>
